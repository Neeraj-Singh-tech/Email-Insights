<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email-Insights | Intelligence Inbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo"><h1>Email-Insights <span>AI Hub</span></h1></div>
            <div class="actions"><button id="seed-btn" class="btn btn-secondary">Seed Demo Data</button></div>
        </header>
        <main class="inbox-layout">
            <section class="email-list-panel">
                <div class="custom-analyzer">
                    <h3>Check your own email</h3>
                    <textarea id="custom-email-text" rows="7" placeholder="Paste an email here or upload a text file to analyze..."></textarea>
                    <div class="custom-action-row">
                        <label class="upload-button" for="email-file-input">
                            <input id="email-file-input" type="file" accept=".txt,.md,.eml,.csv" />
                            Upload file
                        </label>
                        <button id="analyze-btn" class="btn btn-primary">Analyze email</button>
                    </div>
                </div>
                <div class="panel-header"><h2>Inbox Stream</h2><span id="email-counter" class="counter-badge">0 emails</span></div>
                <div id="email-list" class="email-list"><p class="placeholder-text">Click "Seed Demo Data" to load analyzed emails.</p></div>
            </section>
            <section class="email-detail-panel" id="detail-panel">
                <div class="empty-detail" id="empty-detail-state"><p>Select an email from the stream to inspect extracted intelligence.</p></div>
                <div class="detail-content hidden" id="active-detail-state">
                    <div class="detail-header">
                        <div class="badges-row" id="detail-badges"></div>
                        <h2 id="detail-subject"></h2>
                        <p class="sender-info" id="detail-sender"></p>
                    </div>
                    <div class="detail-body" id="detail-body"></div>
                    <hr class="divider">
                    <div class="insights-section">
                        <h3>Model Insights</h3>
                        <div class="insight-block"><strong>Tone &amp; Sentiment:</strong> <span id="detail-tone" class="tone-tag"></span></div>
                        <div class="insight-block"><strong>Action Items &amp; Entities:</strong><div id="detail-entities" class="chips-container"></div></div>
                        <div class="insight-block"><strong>Key Context Phrases:</strong><div id="detail-phrases" class="chips-container"></div></div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
