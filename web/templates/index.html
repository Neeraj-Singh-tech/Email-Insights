<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Inbox - Spam Mail Detector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-a"></div>
    <div class="bg-shape bg-shape-b"></div>

    <div class="app-shell">
      <aside class="sidebar">
        <h1>Smart Inbox</h1>
        <p class="tagline">Live spam sorting powered by your ML model</p>

        <nav class="menu">
          <button class="menu-btn active" data-tab="primary">
            Primary
            <span id="primary-count" class="count">0</span>
          </button>
          <button class="menu-btn" data-tab="spam">
            Spam
            <span id="spam-count" class="count warning">0</span>
          </button>
        </nav>

        <div class="actions">
          <button id="seed-btn" class="ghost-btn">Load Demo Mails</button>
        </div>
      </aside>

      <main class="content">
        <section class="composer">
          <h2>Add New Mail</h2>
          <form id="mail-form">
            <div class="grid">
              <input name="sender" placeholder="Sender email" required />
              <input name="subject" placeholder="Subject" required />
            </div>
            <textarea name="body" rows="4" placeholder="Mail body" required></textarea>
            <button type="submit" class="primary-btn">Analyze and Route</button>
          </form>
          <p id="status" class="status"></p>
        </section>

        <section class="mail-list-wrap">
          <div class="list-header">
            <h2 id="list-title">Primary Inbox</h2>
          </div>
          <div id="mail-list" class="mail-list"></div>
        </section>
      </main>
    </div>

    <template id="mail-card-template">
      <article class="mail-card">
        <div class="top-row">
          <p class="sender"></p>
          <span class="time"></span>
        </div>
        <h3 class="subject"></h3>
        <p class="snippet"></p>
        <div class="meta-row">
          <span class="badge"></span>
          <span class="score"></span>
        </div>
      </article>
    </template>

    <script src="/static/js/app.js"></script>
  </body>
</html>
